[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "walter-manager"
version = "0.1.0"
description = "Walter general-purpose orchestration Manager runtime for the OpenAI Agents SDK"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.22.3,<0.23",
  "pydantic>=2",
  "python-dotenv>=1",
]

[project.scripts]
walter = "walter.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["live: opt-in credit-bearing provider smoke test"]
